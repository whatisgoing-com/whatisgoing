---
kind: pipeline
type: docker
name: ner-sentiment

trigger:
  branch: [main]
  paths:
    include:
      - services/ner-sentiment/**

steps:
  - name: test
    image: python:3.11-slim
    commands:
      - apt-get update && apt-get install -y --no-install-recommends build-essential && rm -rf /var/lib/apt/lists/*
      - pip install --no-cache-dir torch --index-url https://download.pytorch.org/whl/cpu
      - pip install --no-cache-dir -r services/ner-sentiment/requirements-dev.txt
      - python -m spacy download en_core_web_sm
      - cd services/ner-sentiment && python -m pytest -q

  - name: build-and-push
    image: plugins/docker
    settings:
      dockerfile: services/ner-sentiment/Dockerfile
      context: services/ner-sentiment
      registry:
        from_secret: harbor_registry
      repo:
        from_secret: harbor_registry
        suffix: /whatisgoing/ner-sentiment
      username:
        from_secret: harbor_username
      password:
        from_secret: harbor_password
      tags:
        - "${DRONE_COMMIT_SHA:0:8}"
        - latest

  - name: bump-gitops-tag
    image: alpine/git
    environment:
      GITOPS_TOKEN:
        from_secret: gitops_repo_token
    commands:
      - ./scripts/bump-gitops-tag.sh ner-sentiment "${DRONE_COMMIT_SHA:0:8}"

