kind: pipeline
type: docker
name: core

trigger:
  branch: [main]
  paths:
    include:
      - cmd/core/**
      - internal/core/**
      - configs/**
      - go.mod
      - go.sum

steps:
  - name: test
    image: golang:1.25-alpine
    commands:
      - go build ./cmd/core/... ./internal/core/...
      - go vet ./cmd/core/... ./internal/core/...
      - go test ./internal/core/...

  - name: build-and-push
    image: plugins/docker
    settings:
      dockerfile: cmd/core/Dockerfile
      context: .
      registry:
        from_secret: harbor_registry
      repo:
        from_secret: harbor_registry
        suffix: /whatisgoing/core
      username:
        from_secret: harbor_username
      password:
        from_secret: harbor_password
      tags:
        - "${DRONE_COMMIT_SHA:0:8}"
        - latest

  - name: bump-gitops-tag
    image: alpine/git
    environment:
      GITOPS_TOKEN:
        from_secret: gitops_repo_token
    commands:
      - ./scripts/bump-gitops-tag.sh core "${DRONE_COMMIT_SHA:0:8}"

