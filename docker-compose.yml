services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: whatisgoing
      POSTGRES_PASSWORD: whatisgoing
      POSTGRES_DB: whatisgoing
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  meilisearch:
    image: getmeili/meilisearch:v1.11
    environment:
      MEILI_MASTER_KEY: dev-master-key
      MEILI_ENV: development
    ports:
      - "7700:7700"
    volumes:
      - meili-data:/meili_data

  # ner-sentiment (GLiNER + spaCy + the sentiment model) runs natively on
  # the host instead of in Docker (issue #37) — see
  # services/ner-sentiment/run.sh and its README. host.docker.internal is
  # how core, still in Docker, reaches it; extra_hosts makes that resolve
  # on Linux too (Docker Desktop provides it out of the box already).
  core:
    build:
      context: .
      dockerfile: cmd/core/Dockerfile
    environment:
      CORE_PORT: "8080"
      DATABASE_URL: postgres://whatisgoing:whatisgoing@postgres:5432/whatisgoing?sslmode=disable
      MEILISEARCH_URL: http://meilisearch:7700
      MEILISEARCH_KEY: dev-master-key
      NER_SENTIMENT_URL: http://host.docker.internal:8000
      SOURCES_CONFIG_PATH: /configs/sources.yaml
    volumes:
      - ./configs:/configs:ro
    ports:
      - "8080:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - postgres
      - meilisearch
    # On a fresh volume, postgres can still be running initdb when core
    # starts — depends_on only waits for the container to start, not for
    # postgres to actually accept connections. Self-heal rather than
    # requiring a manual restart.
    restart: on-failure

  # React SPA (issue #56), run via Vite's own dev server for local dev —
  # not web/Dockerfile, which builds a static dist/ once and serves it
  # through nginx with no rebuild-on-change, so bind-mounting source over
  # it wouldn't do anything. web/Dockerfile stays as the actual CI/prod
  # build (Drone -> Harbor -> ArgoCD); this service is dev-only, real HMR.
  # A named volume for node_modules keeps host-installed (possibly
  # wrong-arch) node_modules from being shadowed by the bind mount.
  # VITE_CORE_API_URL defaults to core's host-published port — that's
  # what the browser can actually reach, not the docker-network-internal
  # "core" hostname.
  web:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0"
    environment:
      VITE_CORE_API_URL: http://localhost:8080
    volumes:
      - ./web:/app
      - web-node-modules:/app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - core

  # Computes hot-topics/reputation-trend rollups and exits — mirrors the
  # k8s CronJob this becomes in production, not a long-running service.
  # Run on demand: docker compose run --rm rollup
  rollup:
    build:
      context: .
      dockerfile: cmd/rollup/Dockerfile
    environment:
      DATABASE_URL: postgres://whatisgoing:whatisgoing@postgres:5432/whatisgoing?sslmode=disable
    depends_on:
      - postgres
    profiles:
      - tools

  entity-resolver:
    build:
      context: .
      dockerfile: cmd/entity-resolver/Dockerfile
    environment:
      DATABASE_URL: postgres://whatisgoing:whatisgoing@postgres:5432/whatisgoing?sslmode=disable
    depends_on:
      - postgres
    profiles:
      - tools

volumes:
  postgres-data:
  meili-data:
  web-node-modules:
