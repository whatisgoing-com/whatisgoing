services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: whatisgoing
      POSTGRES_PASSWORD: whatisgoing
      POSTGRES_DB: whatisgoing
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  meilisearch:
    image: getmeili/meilisearch:v1.11
    environment:
      MEILI_MASTER_KEY: dev-master-key
      MEILI_ENV: development
    ports:
      - "7700:7700"
    volumes:
      - meili-data:/meili_data

  ner-sentiment:
    build: ./services/ner-sentiment
    ports:
      - "8000:8000"

  core:
    build:
      context: .
      dockerfile: cmd/core/Dockerfile
    environment:
      CORE_PORT: "8080"
      DATABASE_URL: postgres://whatisgoing:whatisgoing@postgres:5432/whatisgoing?sslmode=disable
      MEILISEARCH_URL: http://meilisearch:7700
      MEILISEARCH_KEY: dev-master-key
      NER_SENTIMENT_URL: http://ner-sentiment:8000
      SOURCES_CONFIG_PATH: /configs/sources.yaml
    volumes:
      - ./configs:/configs:ro
    ports:
      - "8080:8080"
    depends_on:
      - postgres
      - meilisearch
      - ner-sentiment
    # On a fresh volume, postgres can still be running initdb when core
    # starts — depends_on only waits for the container to start, not for
    # postgres to actually accept connections. Self-heal rather than
    # requiring a manual restart.
    restart: on-failure

  # React SPA (issue #56) — a plain client-rendered app, calling core's
  # JSON API directly from the browser rather than through a server-side
  # BFF. VITE_CORE_API_URL is baked in at build time (see web/Dockerfile);
  # it defaults to core's host-published port, which is what the browser
  # can actually reach, not the docker-network-internal "core" hostname.
  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    ports:
      - "8081:80"
    depends_on:
      - core

  # Computes hot-topics/reputation-trend rollups and exits — mirrors the
  # k8s CronJob this becomes in production, not a long-running service.
  # Run on demand: docker compose run --rm rollup
  rollup:
    build:
      context: .
      dockerfile: cmd/rollup/Dockerfile
    environment:
      DATABASE_URL: postgres://whatisgoing:whatisgoing@postgres:5432/whatisgoing?sslmode=disable
    depends_on:
      - postgres
    profiles:
      - tools

  entity-resolver:
    build:
      context: .
      dockerfile: cmd/entity-resolver/Dockerfile
    environment:
      DATABASE_URL: postgres://whatisgoing:whatisgoing@postgres:5432/whatisgoing?sslmode=disable
    depends_on:
      - postgres
    profiles:
      - tools

volumes:
  postgres-data:
  meili-data:
