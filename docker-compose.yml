services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: whatisgoing
      POSTGRES_PASSWORD: whatisgoing
      POSTGRES_DB: whatisgoing
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  meilisearch:
    image: getmeili/meilisearch:v1.11
    environment:
      MEILI_MASTER_KEY: dev-master-key
      MEILI_ENV: development
    ports:
      - "7700:7700"
    volumes:
      - meili-data:/meili_data

  ner-sentiment:
    build: ./services/ner-sentiment
    ports:
      - "8000:8000"

  core:
    build:
      context: .
      dockerfile: cmd/core/Dockerfile
    environment:
      CORE_PORT: "8080"
      DATABASE_URL: postgres://whatisgoing:whatisgoing@postgres:5432/whatisgoing?sslmode=disable
      MEILISEARCH_URL: http://meilisearch:7700
      MEILISEARCH_KEY: dev-master-key
      NER_SENTIMENT_URL: http://ner-sentiment:8000
      SOURCES_CONFIG_PATH: /configs/sources.yaml
    volumes:
      - ./configs:/configs:ro
    ports:
      - "8080:8080"
    depends_on:
      - postgres
      - meilisearch
      - ner-sentiment
    # On a fresh volume, postgres can still be running initdb when core
    # starts — depends_on only waits for the container to start, not for
    # postgres to actually accept connections. Self-heal rather than
    # requiring a manual restart.
    restart: on-failure

  ui:
    build:
      context: .
      dockerfile: cmd/ui/Dockerfile
    environment:
      UI_PORT: "8081"
      CORE_API_URL: http://core:8080
    ports:
      - "8081:8081"
    depends_on:
      - core

volumes:
  postgres-data:
  meili-data:
