server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Client-side routing (react-router): any path that isn't a real static
    # file falls back to index.html so a hard refresh on e.g. /entities/475
    # works instead of 404ing.
    location / {
        try_files $uri /index.html;
    }
}
